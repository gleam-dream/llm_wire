# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review policy for llm_wire, derived by the coderabbit-config skill.
# Each instruction names the skill it comes from; `policy` is the review policy
# of coderabbit-config itself, and `repository` marks a rule beyond the catalog.
#
# Catalogs read:
#   practice skills    879841a61c3f83cd809edca9229c4a6bb7f909f8
#   gleam-agent-tools  6a9ea2f647e787a32d3c7fa88d9c58c5b81ae9d7
#
# Governing skills: coderabbit-config (policy), gleam, gleam-lib, gleam-ffi,
# gleam-otp, llm-wire, http-gun, json-blueprint, sinal, testing, python,
# design, tracker, gate, git.
#
# Governing dependency versions: llm_wire 0.2.1 (this package, gleam.toml; the
# llm-wire skill names 0.1.0, and every API its rules cite exists in 0.2.1).
# Locked in manifest.toml and examples/consumer/manifest.toml: http_gun 0.2.0,
# json_blueprint 2.1.1, sinal 0.1.0, gleam_otp 1.3.0, gleam_erlang 1.3.0,
# gleam_stdlib 1.0.5, gleam_json 3.1.0, gleeunit 1.11.0; dev only:
# anthropic_gleam 0.1.1 (oracle), mist 6.0.3 (one integration test server).
# json_blueprint 2.1.1 is below the 2.2.0 the json-blueprint, llm-wire and
# gleam-lib skills name, so their rules stated for 2.2.0 (a codec copies at
# about its own size) are not taken; the codec API rules below hold on 2.1.1.
language: en-US
tone_instructions: >-
  Literal and concise. Report only defects you can evidence from the diff, its
  callers, the design, or a cited rule. One finding per cause. An empty review
  is valid.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Lead with the problem the change solves, then the response in one short
    paragraph, then the public API or provider wire effect, if any. Do not
    narrate the diff file by file.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  # Rendered and recorded output. Cassettes are published by dev/record-live
  # and evidence receipts by the measurement runs; review the recorder and the
  # tests that read them instead.
  path_filters:
    - "!flake.lock"
    - "!docs/design/design-layer.pdf"
    - "!test/cassettes/**"
    - "!docs/evidence/**"

  path_instructions:
    - path: "{src,examples}/**"
      instructions: |
        Review policy (policy).
        - Design first. docs/COVERAGE.md maps each part to its owning section
          in docs/design (root design and the `generation`, `classification`
          and `transcription` contexts) and docs/adr. Flag code that
          contradicts that unit's interface, invariants or side effects, and a
          change to designed behavior with no change to its design. A fix that
          restores designed behavior needs none. When code and design
          disagree, the design changes first.
        - Core abstractions. Flag a second representation of a concept the
          design names (prepared generation, generation settings, assistant
          turn, replay data, stream owner, send evidence, retry advice,
          provider adapter, application deadline, observation), a name that
          differs from the CONTEXT.typ glossaries, and a public module or the
          consumer reaching into `llm_wire/internal` past the interface that
          owns it.
        - Lean. Flag code no test, caller or unit needs: an unset option, an
          unvaried parameter, a wrapper that adds no rule, an unreachable
          branch. Say what to delete.
        - Migration, never a legacy path. Flag a compatibility shim, a
          fallback to an old request or replay format, a dual read or write, a
          deprecated alias, and a flag that keeps old behavior. A change to a
          public module ships as a breaking release with a migration note.
        - Composable. In a public module, flag hidden call ordering, global
          state, a mandatory framework where functions compose, a concept the
          common caller must learn and does not need, and a module with two
          responsibilities.
        - Test first. Flag a behavior change with no test that exercises it,
          and a test bound to internals.
        - Typed before foreign. Flag Erlang where Gleam does the job, an
          unchecked cast, an untyped provider value that reaches domain logic
          undecoded, and a crash on a routine failure.
        - Silence. Report nothing that `gleam format`, the compiler with
          warnings as errors, dev/check-native, the tests or dev/gate decide,
          and no layout or naming preference without a written rule.

    - path: "{src,test,examples}/**/*.gleam"
      instructions: |
        Gleam (gleam).
        - Flag a module function, private included, without annotated
          arguments and return type, and an imported function or constant used
          unqualified.
        - Flag a name against the conventions: `Json` not `JSON`, `Sse` not
          `SSE`, conversions named `x_to_y` or `to_y` inside module `x`,
          `try_` only for an error-propagating counterpart.
        - Flag `Option` carrying a failure, and a change that merges omitted,
          explicit false, empty and failed where they mean different things.
        - Flag an error a caller must parse as a string to choose recovery.
        - Flag independent optional fields or booleans standing for exclusive
          states; they are variants.
        - Flag a predicate check followed by `let assert` on the same shape,
          and a catch-all branch that silently accepts a new variant.
        - Flag `panic` or `let assert` handling a routine provider, network or
          decoding failure in `src/`.
        - Flag a refactor that changes observable errors, ordering or effects.
        - Flag a compatibility branch with no comment saying why it exists.
        - Flag `src/` importing a `test/` or `dev/` module, `gleeunit`,
          `simplifile`, `mist` or `anthropic_gleam` (development
          dependencies).
        - Flag a new process, module or generic machinery added only for
          organization, and a local type replacing a compatible ecosystem type.

    - path: "src/**/*.gleam"
      instructions: |
        Published library surface (gleam-lib). Exported constructors, fields,
        variants, module paths and behavior of non-internal modules are the
        compatibility surface; `internal_modules` in gleam.toml marks
        instability, not access control.
        - Flag a removed or changed export, variant, field or behavior in a
          public module that the pull request does not call breaking.
        - Flag a public signature that exposes an implementation-state type
          parameter.
        - Flag an argument that does not affect behavior, a bound operation
          that makes callers repeat its name or codec at each use, a setter
          per field where a record update works, and two public paths for one
          common task.
        - Flag configuration validated after a resource is allocated, and a
          builder or extension protocol with no distinct use case.
        - Flag a dynamic dispatcher over heterogeneous parameters where typed
          operations can be bound.
        - Flag a deliberate crash on a failure the caller could act on; return
          a structured error instead.
        - Flag the library taking over what AGENTS.md gives the application:
          conversation history, retry, tool execution, the shared HTTP Gun
          client, and trust and transport policy.

    - path: "examples/consumer/src/**/*.gleam"
      instructions: |
        Public consumer (gleam-lib; AGENTS.md).
        - Flag an import of `llm_wire/internal` or any other non-public
          module; the consumer uses public imports only.
        - Flag a usage example that no longer shows the common path, a
          customization, an expected failure and, where relevant, two
          independent instances for the API it documents.

    - path: "{src,test,examples}/**/*.{gleam,erl}"
      instructions: |
        Foreign boundaries (gleam-ffi). Apply to `*.erl` files and to a Gleam
        module that declares `@external`.
        - Flag validation, branching or state transitions in foreign code; it
          performs the native call and the representation conversion only.
        - Flag an external that declares a native value to be a checked domain
          value, `Dynamic` or a type variable that accepts every handle, and a
          generic return that hides an unchecked cast.
        - Flag an Erlang function that returns a value the declared Gleam type
          does not describe, such as a bare atom where a `Result` or variant
          tuple is declared.
        - Flag an expected native failure not mapped to the declared failure
          value, and code that assumes Gleam catches a foreign exception.
        - Flag a foreign function with no remaining caller.

    - path: "{src,examples}/**/*.gleam"
      instructions: |
        Processes (gleam-otp; gleam_otp 1.3.0, gleam_erlang 1.3.0). Apply to a
        module that imports `gleam/otp/actor` or `gleam/erlang/process`.
        - Flag an actor whose messages are not one explicit message type, and
          request/reply mechanics exposed instead of hidden behind public
          functions.
        - Flag slow work (network, provider reads, decoding a large body) run
          inside the stream owner or another coordinator that must stay
          responsive to cancellation and close.
        - Flag accepted work, active workers or waiting messages with no
          bound.
        - Flag a subject received from a process that does not own it.
        - Flag code that treats `process.call` as returning a timeout `Error`;
          it panics on timeout, callee exit or a missing name.
        - Flag a message, spawn closure or start argument that captures a
          large term (a tool list, a codec, a whole request) where an id or a
          module constant would do.
        - Flag an atom or process name built from request or provider input.
        - Flag an actor introduced only to organize functions.

    - path: "src/**/*.gleam"
      instructions: |
        LLM Wire contract (llm-wire).
        - Flag I/O, a process or a clock read reachable from `prepare`; it
          validates and encodes only.
        - Flag code that schedules, sleeps for or repeats a provider call; LLM
          Wire classifies retry prospects with `advise` and never retries.
        - Flag a `next_within` that ends or closes the stream on `TimedOut`;
          the stream stays readable.
        - Flag a token-limited, refused or invalid structured answer returned
          as `Answer`; they are `OutputLimited`, `Refused` or a failure.
        - Flag a change that drops call ids, call ordering or opaque provider
          replay data from `AssistantTurn` or its codec.
        - Flag missing usage reported as zero tokens, and a `ProviderDelay`
          capped by the package.
        - Flag tool execution, authorization or tool error policy moved into
          the package.

    - path: "examples/consumer/src/**/*.gleam"
      instructions: |
        LLM Wire consumer (llm-wire).
        - Flag a request executed without `prepare` and handling of its
          unsupported settings and schemas.
        - Flag a `case` on a call outcome that does not name `Answer`,
          `NeedsTools`, `OutputLimited` and `Refused`, and an `OutputLimited`
          partial treated as a complete typed answer.
        - Flag a `NeedsTools` follow-up that does not append
          `message.Assistant(turn)` and one `tool_result` per call, and a turn
          rebuilt from visible text instead of kept or decoded with the
          message and turn codecs.
        - Flag tool arguments acted on before they are decoded, and a model
          request treated as authorization for a business action.
        - Flag a `with_output` codec whose root is not a record.
        - Flag a stream neither read until `Done` nor closed, and two readers
          of one stream.
        - Flag `TimedOut` from `next_within` treated as the end of the call.
        - Flag every failure retried, `advise` treated as an effect guarantee,
          `MaybeSent` treated as no paid work, and a wait on `ProviderDelay`
          that exceeds the remaining application deadline.
        - Flag a short-lived HTTP Gun client not stopped on every exit path.
        - Flag credentials written in source instead of read from live
          configuration.

    - path: "{src,examples}/**/*.gleam"
      instructions: |
        HTTP Gun (http-gun; http_gun 0.2.0). Apply to a module that imports
        `http_gun`.
        - Flag a decoded response body with no check of `status` first; an
          `Ok` transport result can hold a 404 or 503.
        - Flag a truncated collection (`truncated`) decoded as a complete JSON
          document.
        - Flag a body opened with `open` that is not closed on every path,
          including after EOF or a failed collection, and a body read from a
          process other than the one that opened it.
        - Flag `body.next_within` returning `None` treated as EOF.
        - Flag a retry decision made without the failure's send evidence and
          `error.is_retryable(failure, idempotent:)` under the request's real
          semantics, and a timeout or cancellation treated as proof the
          provider did nothing.
        - Flag a destination view that widens authority, loopback enabled
          outside local fixtures, and disabled TLS verification.
        - Flag a recording whose redaction does not cover provider headers,
          query tokens and bodies, and a recording not finished with its
          result handled.
        - Flag a shared client started by a short-lived request process.

    - path: "{src,examples}/**/*.gleam"
      instructions: |
        JSON Blueprint codecs (json-blueprint; json_blueprint 2.1.1). Apply to
        a module that imports `json/blueprint`.
        - Flag a callback passed to `field`, `optional_field`, `success` or a
          getter that has an effect or is not synchronous and pure, and a
          placeholder value from schema discovery stored as data.
        - Flag a change that merges omission, null and a value; over
          `nullable`, `optional_field` yields `None`, `Some(None)` and
          `Some(Some(value))`.
        - Flag a definition derived at run time and used without
          `codec.check`.
        - Flag a union `match` that returns a value tagged by another union.
        - Flag untrusted provider text parsed without `value.default_limits()`
          or `value.with_max_bytes`, and `Float` or `codec.int()` used for an
          exact number where the `number` API applies.
        - Flag a reader of `codec.view` that does not handle `OtherSchema`,
          and a `contract` change that accepts a recursive reference, an
          untagged union or a pattern.
        - Flag a codec stored with `term_to_binary`.

    - path: "{src,examples}/**/*.gleam"
      instructions: |
        Telemetry (sinal; sinal 0.1.0). Apply to a module that imports
        `sinal`.
        - Flag an event name, field key or route prefix built from run-time
          input; they become atoms. Unbounded values go in metadata values.
        - Flag an event defined twice instead of one definition shared by
          emitter and observer.
        - Flag a getter or encoder that can raise.
        - Flag an attachment never detached, and an unrouted handler that does
          I/O or other slow work.
        - Flag prompt text, model output or credentials put in an observation.
        - Flag telemetry used to decide whether a provider call or business
          commit happened, and forwarding treated as lossless.

    - path: "test/**"
      instructions: |
        Tests (testing).
        - Flag a test that confirms success through internals, private state
          or a side channel where the public API can show it.
        - Flag a mock of an internal collaborator, and an assertion on call
          counts or call order. Scripted provider exchanges, cassettes and the
          local fake servers stand in for the true external.
        - Flag a scenario outcome that no design rule states.
        - Flag tests left in place for an interface the diff replaced.
        - Flag a refusal or illegal input the change introduces with no test
          through the public boundary.
        - Flag a change to a provider boundary (streaming, deadlines, retry
          evidence) with no case for timeout, partial completion or
          duplicate delivery where the design states one.
        - Flag a test that reaches a live provider outside the opt-in
          `dev/record-live` scenarios.

    - path: "{dev,test}/**/*.py"
      instructions: |
        Python harnesses and fixtures (python).
        - Flag `Any`, and an external value (request body, JSON, process
          output) used without parsing.
        - Flag an abstract base class hierarchy; use `Protocol`.
        - Flag mutable dataclasses inside the program, and exclusive states as
          flags instead of tagged frozen dataclasses matched with
          `assert_never`.
        - Flag a parser model passed past the boundary.

    - path: "docs/{design,adr}/**"
      instructions: |
        Design layer (design; policy).
        - Fresh reader. The reviewer never saw the change being made. Flag a
          changed unit that does not tell a reader with no memory what the
          code does not say, and a unit that copies the code.
        - Flag content the code states: payloads, fields, limits, timeouts,
          retries, function or file lists. Name the rule it serves instead; a
          file or symbol is allowed only where a reader needs it to find where
          a rule is enforced.
        - Flag session narration, progress notes, status or delivery history.
        - Flag a unit missing one of overview, interface, invariants, side
          effects and verification; an empty part says "none".
        - Flag a concept defined in a second home, a glossary term with two
          meanings, and a retired term reused.
        - Flag an edit to an accepted ADR's text instead of a superseding ADR,
          and a changed date on a pending entry.

    - path: "issues/**/*.md"
      instructions: |
        Local tracker (tracker; AGENTS.md).
        - Each issue file under `issues/<feature>/issues/` carries one
          `Status:` and one `Category:` header with a value AGENTS.md lists.
        - Flag an issue titled with a solution instead of the observable
          problem, line numbers or solution code in an issue, and a horizontal
          task such as "build the data layer".
        - Flag an AI-written comment that does not start with
          `AI-assisted contribution.`

    - path: "{dev/**,test/*.sh,flake.nix,lefthook.yml,.github/workflows/**}"
      instructions: |
        Gate (gate).
        - Flag a check that passes or skips when its tool is missing; it
          fails or reports unmeasured.
        - Flag a tool not supplied through the Nix flake, and a command that
          differs between local runs and CI.
        - Flag a new check that encodes a layout, naming or README
          convention, and a check that scripts what a tool already performs.
        - Flag a replaced check that drops security or data-integrity
          coverage.
        - Flag a gate that keeps a formatting check but loses the build with
          warnings as errors, dev/check-native or the behavior tests.
        - Flag a gate step that spends provider tokens or needs credentials;
          gates use offline and local inputs (AGENTS.md).

    - path: ".github/workflows/pr-title.yml"
      instructions: |
        Pull request title check (gate).
        - This file mirrors the shared title workflow. Flag a change that
          makes it differ from the shared copy: types, patterns, action pin,
          triggers or permissions.
        - It is the one convention CI checks, so do not flag it as a
          convention turned into a check.
        - Its tool is the pinned action in place of a flake tool, because the
          title exists on the pull request and never in a checkout.

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: No weakened test or gate
        mode: error
        instructions: |
          Source: policy, gate. Fail if the diff skips, deletes, disables or
          loosens a test, a cassette replay case, an oracle case or a step of
          dev/gate or CI (including removing `--warnings-as-errors`,
          dev/check-native, the external consumer or the local HTTP harness
          from the full gate, or adding `continue-on-error`), and the pull
          request description does not name the behavior that no longer
          exists or the stronger check that replaces it. Pass otherwise.
      - name: Behavior change carries its design
        mode: warning
        instructions: |
          Source: policy, design. Warn if the diff changes public behavior,
          an invariant or a provider wire contract in src/ with no change
          under docs/design or docs/adr, and the pull request description does
          not say the change restores designed behavior or preserves behavior.
          Pass for tests, tooling and documentation-only changes.
      - name: Breaking change is declared
        mode: warning
        instructions: |
          Source: policy, gleam-lib. Warn if the diff removes or changes an
          exported function, type, constructor, field or module path in a
          module outside `llm_wire/internal`, and the pull request description
          does not call the change breaking and give its migration. Pass
          otherwise.
      - name: Public API change reaches the consumer
        mode: warning
        instructions: |
          Source: gleam-lib, AGENTS.md. Warn if the diff adds, removes or
          changes an exported function, type, constructor or field in a
          module outside `llm_wire/internal` and changes nothing under
          examples/consumer/src, and the pull request description does not
          say why no usage example covers it. Pass otherwise.
      - name: Problem-first description
        mode: warning
        instructions: |
          Source: git. Warn unless the pull request description gives the
          problem, why it matters, one concrete example, the solution in one
          paragraph, its trade-offs, and what was verified, with no file
          tour, and its claims match the diff.
      - name: No attribution text
        mode: warning
        instructions: |
          Source: git. Warn if the pull request title or description contains
          a co-author credit, `Co-Authored-By`, a "Generated with" or
          "Generated by" line, or a line starting with the robot emoji.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    # ruff reads ruff.toml, the repository's own lint selection.
    ruff:
      enabled: true
    # The repository runs no other Python, JavaScript, prose or YAML linter;
    # their findings would be preferences without a written rule (policy,
    # Silence).
    flake8:
      enabled: false
    pylint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    yamllint:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - files: "docs/COVERAGE.md,docs/CONTEXT-MAP.md,docs/design/**/*.typ,docs/adr/*.md"
        applyTo: "src/**,examples/**,test/**"
      - files: "docs/ORACLE.md"
        applyTo: "test/**"
  learnings:
    scope: local
  pull_requests:
    scope: local
