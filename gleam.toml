name = "llm_wire"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "A bounded HTTP/SSE LLM client for Gleam with typed provider adapters, streaming, and caller-owned conversations."
repository = { type = "github", user = "gleam-dream", repo = "llm_wire" }

internal_modules = ["llm_wire/internal", "llm_wire/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8bc8ab4e7d04b23d209680f849e976074bf7c90f" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "95f2dbce4459942e16e819e3527eb00d9c503c9d" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "b2fe1d7cd0ea121e679cdf2c4af5b078330c33e7" }
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
simplifile = ">= 2.7.0 and < 3.0.0"
anthropic_gleam = ">= 0.1.1 and < 1.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.2 and < 7.0.0"
